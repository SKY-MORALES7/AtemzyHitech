<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <pattern id="grid3" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <rect width="1200" height="800" fill="url(#grid3)"/>
  <!-- PCB Circuit Traces -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 100 160 H 320 L 400 240 H 500"/>
    <path d="M 100 320 H 280 L 360 400 H 460"/>
    <path d="M 100 620 H 340 L 420 540 H 500"/>
    <path d="M 1100 160 H 880 L 800 240 H 700"/>
    <path d="M 1100 400 H 740"/>
    <path d="M 1100 620 H 860 L 780 540 H 700"/>
    <path d="M 600 80 V 260"/>
    <path d="M 600 720 V 540"/>
  </g>
  <!-- Central Microprocessor / SCADA Controller -->
  <rect x="440" y="240" width="320" height="320" rx="24" fill="#090e1a" stroke="#38bdf8" stroke-width="4"/>
  <rect x="476" y="276" width="248" height="248" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
  <text x="600" y="385" fill="#38bdf8" font-family="monospace" font-size="30" font-weight="bold" text-anchor="middle">SCADA / BMS</text>
  <text x="600" y="428" fill="#7dd3fc" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">OEM TELEMETRY CORE</text>
  <!-- Solder Vias -->
  <g fill="#020617" stroke="#38bdf8" stroke-width="3">
    <circle cx="100" cy="160" r="9"/><circle cx="100" cy="320" r="9"/><circle cx="100" cy="620" r="9"/>
    <circle cx="1100" cy="160" r="9"/><circle cx="1100" cy="400" r="9"/><circle cx="1100" cy="620" r="9"/>
    <circle cx="600" cy="80" r="9"/><circle cx="600" cy="720" r="9"/>
  </g>
</svg>

