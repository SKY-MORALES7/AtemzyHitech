<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d21" />
      <stop offset="50%" stop-color="#0b1f47" />
      <stop offset="100%" stop-color="#07152e" />
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="towerSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="signalPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Technical Blueprint Background -->
  <rect width="1200" height="800" fill="url(#bgSky)" />

  <!-- Isometric Blueprint Grid -->
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="700" x2="1200" y2="700" />
    <line x1="150" y1="0" x2="150" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="450" y1="0" x2="450" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="750" y1="0" x2="750" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    <line x1="1050" y1="0" x2="1050" y2="800" />
  </g>

  <!-- Concentric Radio Propagation Waves from Primary Mast -->
  <circle cx="600" cy="210" r="140" fill="url(#signalPulse)" />
  <circle cx="600" cy="210" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5" />
  <circle cx="600" cy="210" r="280" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="12 10" opacity="0.35" />
  <circle cx="600" cy="210" r="380" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6 12" opacity="0.25" />

  <!-- Microwave Point-to-Point Transmission Beams -->
  <polygon points="640,260 1120,160 1120,330" fill="url(#cyanBeam)" />
  <line x1="640" y1="260" x2="980" y2="335" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" opacity="0.8" />
  <line x1="560" y1="290" x2="230" y2="375" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" opacity="0.8" />

  <!-- Secondary Left Lattice Mast (Multi-Site Mass Deployment) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" opacity="0.7">
    <polygon points="230,340 190,680 270,680" />
    <line x1="215" y1="450" x2="245" y2="450" />
    <line x1="205" y1="530" x2="255" y2="530" />
    <line x1="196" y1="610" x2="264" y2="610" />
    <line x1="215" y1="450" x2="255" y2="530" />
    <line x1="245" y1="450" x2="205" y2="530" />
    <line x1="205" y1="530" x2="264" y2="610" />
    <line x1="255" y1="530" x2="196" y2="610" />
    <circle cx="230" cy="375" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Secondary Right Lattice Mast (Multi-Site Mass Deployment) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" opacity="0.7">
    <polygon points="980,300 935,680 1025,680" />
    <line x1="965" y1="420" x2="995" y2="420" />
    <line x1="955" y1="510" x2="1005" y2="510" />
    <line x1="945" y1="600" x2="1015" y2="600" />
    <line x1="965" y1="420" x2="1005" y2="510" />
    <line x1="995" y1="420" x2="955" y2="510" />
    <line x1="955" y1="510" x2="1015" y2="600" />
    <line x1="1005" y1="510" x2="945" y2="600" />
    <circle cx="980" cy="335" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- PRIMARY CENTRAL TELECOM & MASS INSTALLATION LATTICE TOWER -->
  <g stroke="url(#towerSteel)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Guy Wires & Anchor Pads -->
    <line x1="575" y1="260" x2="340" y2="680" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="625" y1="260" x2="860" y2="680" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="560" y1="410" x2="390" y2="680" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />
    <line x1="640" y1="410" x2="810" y2="680" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />

    <!-- Main Lattice Legs -->
    <line x1="585" y1="150" x2="490" y2="680" stroke-width="5" />
    <line x1="615" y1="150" x2="710" y2="680" stroke-width="5" />
    <line x1="600" y1="130" x2="600" y2="680" stroke-width="2.5" opacity="0.65" />

    <!-- Horizontal & Diagonal Lattice Bracing Tiers -->
    <!-- Tier 1 -->
    <line x1="580" y1="190" x2="620" y2="190" stroke-width="3" />
    <line x1="585" y1="150" x2="620" y2="190" stroke-width="2" />
    <line x1="615" y1="150" x2="580" y2="190" stroke-width="2" />
    <!-- Tier 2 -->
    <line x1="570" y1="250" x2="630" y2="250" stroke-width="3" />
    <line x1="580" y1="190" x2="630" y2="250" stroke-width="2.2" />
    <line x1="620" y1="190" x2="570" y2="250" stroke-width="2.2" />
    <!-- Tier 3 -->
    <line x1="558" y1="320" x2="642" y2="320" stroke-width="3.2" />
    <line x1="570" y1="250" x2="642" y2="320" stroke-width="2.4" />
    <line x1="630" y1="250" x2="558" y2="320" stroke-width="2.4" />
    <!-- Tier 4 -->
    <line x1="544" y1="400" x2="656" y2="400" stroke-width="3.5" />
    <line x1="558" y1="320" x2="656" y2="400" stroke-width="2.6" />
    <line x1="642" y1="320" x2="544" y2="400" stroke-width="2.6" />
    <!-- Tier 5 -->
    <line x1="528" y1="490" x2="672" y2="490" stroke-width="3.8" />
    <line x1="544" y1="400" x2="672" y2="490" stroke-width="2.8" />
    <line x1="656" y1="400" x2="528" y2="490" stroke-width="2.8" />
    <!-- Tier 6 -->
    <line x1="510" y1="585" x2="690" y2="585" stroke-width="4" />
    <line x1="528" y1="490" x2="690" y2="585" stroke-width="3" />
    <line x1="672" y1="490" x2="510" y2="585" stroke-width="3" />
    <!-- Tier 7 Base -->
    <line x1="510" y1="585" x2="710" y2="680" stroke-width="3.2" />
    <line x1="690" y1="585" x2="490" y2="680" stroke-width="3.2" />
  </g>

  <!-- Sector Panel Antennas & Microwave Dishes on Primary Tower -->
  <!-- Top Lightning Arrestor & Aviation Beacon -->
  <line x1="600" y1="75" x2="600" y2="150" stroke="#7dd3fc" stroke-width="4" />
  <circle cx="600" cy="75" r="28" fill="url(#beaconGlow)" />
  <circle cx="600" cy="75" r="6" fill="#fbbf24" />

  <!-- Sector Antenna Array Platform -->
  <rect x="542" y="180" width="116" height="12" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="536" y="158" width="16" height="54" rx="3" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="2" />
  <rect x="648" y="158" width="16" height="54" rx="3" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="2" />
  <rect x="592" y="155" width="16" height="58" rx="3" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="2" />

  <!-- Microwave Backhaul Drum Dishes -->
  <g>
    <circle cx="645" cy="260" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" />
    <circle cx="645" cy="260" r="10" fill="#38bdf8" />
    <circle cx="555" cy="295" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" />
    <circle cx="555" cy="295" r="8" fill="#38bdf8" />
  </g>

  <!-- Base Equipment Shelter & Ground Earthing Plinth -->
  <rect x="430" y="680" width="340" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="140" y="680" width="920" height="6" rx="3" fill="#38bdf8" opacity="0.6" />
</svg>
